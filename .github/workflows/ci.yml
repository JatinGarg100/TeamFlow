name: TeamFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: Backend Testing & Integration Checks
  # ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    services:
      # MongoDB service container for integration test suites
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Phase 1 Security & Validation Tests
        working-directory: ./server
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/teamflow-test
          JWT_SECRET: ci_test_secret_key_for_automated_testing_purposes_only_123456
          JWT_EXPIRES_IN: 7d
        run: node src/scripts/testPhase1Quality.js

      - name: Run Phase 2 Mongoose & Aggregation Tests
        working-directory: ./server
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/teamflow-test
          JWT_SECRET: ci_test_secret_key_for_automated_testing_purposes_only_123456
          JWT_EXPIRES_IN: 7d
        run: node src/scripts/testPhase2Mongoose.js

      - name: Run Phase 3 Pagination & Search Tests
        working-directory: ./server
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/teamflow-test
          JWT_SECRET: ci_test_secret_key_for_automated_testing_purposes_only_123456
          JWT_EXPIRES_IN: 7d
        run: node src/scripts/testPhase3Pagination.js

      - name: Run Phase 4 Task File Attachment Tests
        working-directory: ./server
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/teamflow-test
          JWT_SECRET: ci_test_secret_key_for_automated_testing_purposes_only_123456
          JWT_EXPIRES_IN: 7d
        run: node src/scripts/testPhase4Attachments.js

      - name: Run Core Requirements Regression Suite
        working-directory: ./server
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/teamflow-test
          JWT_SECRET: ci_test_secret_key_for_automated_testing_purposes_only_123456
          JWT_EXPIRES_IN: 7d
        run: node src/scripts/testNewRequirements.js

  # ─────────────────────────────────────────────────────────
  # Job 2: Frontend Production Build Verification
  # ─────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./client
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Verify Compiled Output
        working-directory: ./client
        run: |
          test -d dist
          test -f dist/index.html
          echo "Production assets successfully compiled into client/dist/"
