services:
  # ─────────────────────────────────────────────────────────────
  # Database Service (MongoDB)
  # ─────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0-jammy
    container_name: teamflow-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - teamflow-network
    # Only bound internally within the Docker network for security.
    # Uncomment ports below only if external GUI access (e.g. Compass) is required.
    # ports:
    #   - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────
  # Backend API Service (Express.js)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: teamflow-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/teamflow
      - JWT_SECRET=${JWT_SECRET:-teamflow_default_docker_secret_key_change_in_production_123456}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    volumes:
      # Persistent named volume for task attachments (Phase 4)
      - task_attachments:/app/uploads/task-attachments
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - teamflow-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/healthz', (res) => { if (res.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────────────────────
  # Frontend Client Service (React/Vite with Nginx)
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:${SERVER_PORT:-5000}/api
    container_name: teamflow-frontend
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - teamflow-network

# ─────────────────────────────────────────────────────────────
# Persistent Volumes & Networks
# ─────────────────────────────────────────────────────────────
volumes:
  # Persistent MongoDB data storage
  mongo_data:
    driver: local
  # Persistent storage for uploaded task files
  task_attachments:
    driver: local

networks:
  teamflow-network:
    driver: bridge
